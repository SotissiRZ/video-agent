<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOVID AI — Vidéos marketing générées par IA</title>
  <meta name="description" content="Décrivez votre vidéo en une phrase : script, voix-off, vraies photos, sous-titres et publication automatique sur TikTok, Instagram, YouTube et LinkedIn." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <script src="/assets/boot.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><i data-icon="logo" data-size="26"></i>SOVID AI</a>
      <nav class="site-nav">
        <a href="#how" data-i18n="landing.nav.how">Comment ça marche</a>
        <a href="#features" data-i18n="landing.nav.features">Fonctionnalités</a>
        <a href="#pricing" data-i18n="landing.nav.pricing">Tarifs</a>
        <a href="#faq" data-i18n="landing.nav.faq">FAQ</a>
      </nav>
      <div class="actions">
        <div class="segmented" data-lang-switch></div>
        <button type="button" class="btn btn-ghost btn-icon" data-theme-toggle></button>
        <a class="btn btn-ghost" id="loginLink" href="/app#login" data-i18n="landing.login">Se connecter</a>
        <a class="btn btn-primary hide-sm" id="startLink" href="/app#signup" data-i18n="landing.start">Commencer gratuitement</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <span class="eyebrow"><i data-icon="sparkles" data-size="15"></i><span data-i18n="landing.hero.eyebrow"></span></span>
          <h1 data-i18n-html="landing.hero.title"></h1>
          <p class="lead" data-i18n="landing.hero.subtitle"></p>
          <div class="cta">
            <a class="btn btn-primary btn-lg" href="/app#signup" data-start><span data-i18n="landing.start"></span><i data-icon="arrow"></i></a>
            <a class="btn btn-secondary btn-lg" href="#pricing" data-i18n="landing.hero.cta2"></a>
          </div>
          <p class="note"><i data-icon="check" data-size="15"></i><span data-i18n="landing.hero.note"></span></p>
        </div>
        <div class="mock" aria-hidden="true">
          <div class="mock-prompt"><i data-icon="sparkles"></i><span data-i18n="landing.mock.prompt"></span></div>
          <div class="phone">
            <div class="screen">
              <span class="tag">SOVID AI</span>
              <div class="big" data-i18n="landing.mock.title"></div>
              <span class="pill" data-i18n="landing.mock.sub"></span>
              <span class="caption">♪ SOVID AI</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section alt" id="how">
      <div class="container">
        <div class="section-head"><h2 data-i18n="landing.how.title"></h2></div>
        <div class="steps-3">
          <div class="card step-card"><div class="num">1</div><h3 data-i18n="landing.how.1.title"></h3><p data-i18n="landing.how.1.text"></p></div>
          <div class="card step-card"><div class="num">2</div><h3 data-i18n="landing.how.2.title"></h3><p data-i18n="landing.how.2.text"></p></div>
          <div class="card step-card"><div class="num">3</div><h3 data-i18n="landing.how.3.title"></h3><p data-i18n="landing.how.3.text"></p></div>
        </div>
      </div>
    </section>

    <section class="section" id="features">
      <div class="container">
        <div class="section-head"><h2 data-i18n="landing.features.title"></h2></div>
        <div class="features">
          <div class="card feature"><div class="icon-wrap"><i data-icon="type"></i></div><h3 data-i18n="landing.f.script.title"></h3><p data-i18n="landing.f.script.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="image"></i></div><h3 data-i18n="landing.f.media.title"></h3><p data-i18n="landing.f.media.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="mic"></i></div><h3 data-i18n="landing.f.voice.title"></h3><p data-i18n="landing.f.voice.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="layout"></i></div><h3 data-i18n="landing.f.formats.title"></h3><p data-i18n="landing.f.formats.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="file"></i></div><h3 data-i18n="landing.f.subs.title"></h3><p data-i18n="landing.f.subs.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="send"></i></div><h3 data-i18n="landing.f.publish.title"></h3><p data-i18n="landing.f.publish.text"></p></div>
        </div>
      </div>
    </section>

    <section class="section alt" id="africa">
      <div class="container">
        <div class="section-head"><h2 data-i18n="landing.africa.title"></h2><p data-i18n="landing.africa.subtitle"></p></div>
        <div class="africa">
          <div class="card feature"><div class="icon-wrap"><i data-icon="phone"></i></div><h3 data-i18n="landing.africa.pay.title"></h3><p data-i18n="landing.africa.pay.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="globe"></i></div><h3 data-i18n="landing.africa.lang.title"></h3><p data-i18n="landing.africa.lang.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="whatsapp"></i></div><h3 data-i18n="landing.africa.wa.title"></h3><p data-i18n="landing.africa.wa.text"></p></div>
          <div class="card feature"><div class="icon-wrap"><i data-icon="zap"></i></div><h3 data-i18n="landing.africa.music.title"></h3><p data-i18n="landing.africa.music.text"></p></div>
        </div>
      </div>
    </section>

    <section class="section" id="pricing">
      <div class="container">
        <div class="section-head"><h2 data-i18n="landing.pricing.title"></h2><p data-i18n="landing.pricing.subtitle"></p></div>
        <div class="plans" id="plans"></div>
      </div>
    </section>

    <section class="section alt" id="faq">
      <div class="container">
        <div class="section-head"><h2 data-i18n="landing.faq.title"></h2></div>
        <div class="faq">
          <details><summary data-i18n="landing.faq.1.q"></summary><p data-i18n="landing.faq.1.a"></p></details>
          <details><summary data-i18n="landing.faq.2.q"></summary><p data-i18n="landing.faq.2.a"></p></details>
          <details><summary data-i18n="landing.faq.3.q"></summary><p data-i18n="landing.faq.3.a"></p></details>
          <details><summary data-i18n="landing.faq.4.q"></summary><p data-i18n="landing.faq.4.a"></p></details>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top: 0">
      <div class="container">
        <div class="cta-band">
          <h2 data-i18n="landing.cta.title"></h2>
          <a class="btn btn-lg" href="/app#signup" data-start data-i18n="landing.start"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="/"><i data-icon="logo" data-size="22"></i>SOVID AI</a>
      <nav class="footer-links">
        <a href="/legal#terms" data-i18n="legal.terms"></a>
        <a href="/legal#privacy" data-i18n="legal.privacy"></a>
        <a href="/legal#notice" data-i18n="legal.notice"></a>
      </nav>
      <span>© <span id="year"></span> SOVID AI. <span data-i18n="landing.footer.rights"></span></span>
    </div>
  </footer>

  <script type="module" src="/assets/landing.js"></script>
</body>
</html>
