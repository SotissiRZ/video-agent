  <script src="/assets/boot.js"></script>
  <link rel="stylesheet" href="/assets/style.css" />

</head>
<body class="lp">
  <header class="lp-header">
    <div class="container">
      <a class="lp-wordmark" href="/">SOVID<small>AI</small></a>
      <nav class="lp-nav">
        <a href="#examples" data-i18n="landing.nav.examples"></a>
        <a href="#how" data-i18n="landing.nav.how"></a>
        <a href="#pricing" data-i18n="landing.nav.pricing"></a>
        <a href="#faq" data-i18n="landing.nav.faq"></a>
      </nav>
      <div class="actions">
        <div class="segmented" data-lang-switch></div>
        <button type="button" class="btn btn-ghost btn-icon" data-theme-toggle></button>
        <a class="login" id="loginLink" href="/app#login" data-i18n="landing.login"></a>
        <a class="btn-ink btn-sm" id="startLink" href="/app#signup" data-i18n="landing.start"></a>

          <h1 class="lp-title">

          <p class="lp-note"><i data-icon="check" data-size="16"></i><span id="heroNote"></span></p>
        </div>
        <div class="lp-stage">
          <div class="lp-chat">
            <span data-i18n="landing.hero.prompt"></span>

          <div class="lp-reel">
            <video src="/assets/media/hero.mp4" poster="/assets/media/hero-poster.jpg" autoplay muted loop playsinline preload="metadata" aria-label="Vidéo publicitaire créée par SOVID AI"></video>

          <div class="lp-stamp" data-i18n="landing.hero.stamp"></div>

        <div class="lp-gallery">
          <figure><img src="/assets/media/ex-1.jpg" alt="" loading="lazy" width="270" height="480" /><figcaption data-i18n-html="landing.ex.1"></figcaption></figure>
          <figure><img src="/assets/media/ex-2.jpg" alt="" loading="lazy" width="270" height="480" /><figcaption data-i18n-html="landing.ex.2"></figcaption></figure>

          <figure><img src="/assets/media/ex-4.jpg" alt="" loading="lazy" width="270" height="480" /><figcaption data-i18n-html="landing.ex.4"></figcaption></figure>

        </div>
